name: Build & Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify structure
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME | head -5
          echo "=== TVJ folder ==="
          ls -la TVJ/
          echo "=== android folder ==="
          ls -la android/ | head -10

      - name: Ensure index.html exists
        run: |
          if [ ! -f TVJ/index.html ]; then
            if [ -f TVJ/TVJ.html ]; then
              cp TVJ/TVJ.html TVJ/index.html
              echo "Copied TVJ.html -> index.html"
            else
              echo "ERROR: no TVJ.html or index.html in TVJ/"
              ls -la TVJ/
              exit 1
            fi
          fi
          ls -la TVJ/

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Pin Gradle to 8.14.3
        run: |
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip" > android/gradle/wrapper/gradle-wrapper.properties
          
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Build signed APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=$KS_PASS \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS

      - name: Copy APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/TVJ-${GITHUB_REF_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: dist/*.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk